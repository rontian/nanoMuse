# Shared family Relay. Build from the checked-out Fork's cloud/ source.
# Runtime and persistent configuration do not live inside this Git repository.
name: nanomuse-family
services:
  relay:
    image: nanomuse-relay:fork-local
    build:
      context: ../../cloud
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ${NANOMUSE_CONFIG_ROOT:?Set NANOMUSE_CONFIG_ROOT}/relay.env
        required: true
    ports:
      - "${RELAY_BIND_IP:-127.0.0.1}:${RELAY_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: ${NANOMUSE_DATA_ROOT:?Set NANOMUSE_DATA_ROOT}/relay
        target: /srv/nanomuse-cloud/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
